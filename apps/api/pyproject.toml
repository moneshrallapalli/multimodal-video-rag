[project]
name = "api"
version = "0.0.0"
description = "FastAPI backend for the multimodal video RAG platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "graph",
    "shared",
    "boto3>=1.34",
    "mangum>=0.19",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "torch>=2.2",
    "sentence-transformers>=3.0",
]

[tool.uv.sources]
graph = { workspace = true }
shared = { workspace = true }
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
