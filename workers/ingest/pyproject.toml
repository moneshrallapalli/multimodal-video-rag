[project]
name = "ingest"
version = "0.0.0"
description = "Ingestion worker: frames, transcription, embeddings, upsert"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
