[project]
name = "graph"
version = "0.0.0"
description = "LangGraph query pipeline for the multimodal video RAG platform"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph"]
