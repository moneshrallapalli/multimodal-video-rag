[project]
name = "multimodal-video-rag"
version = "0.0.0"
description = "Multimodal video RAG platform (uv workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "workers/ingest"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "workers/ingest/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
