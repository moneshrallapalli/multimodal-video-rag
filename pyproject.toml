[project]
name = "multimodal-video-rag"
version = "0.0.0"
description = "Multimodal video RAG platform (uv workspace root)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api", "workers/ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
